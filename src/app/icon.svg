<!--
  The favicon, which is the one place the app-icon treatment belongs: at 16px
  a bare stroked glyph on the browser's own chrome disappears, so the mark gets
  a violet tile to sit on. The B is the same three primitives as the in-page
  mark at the same 3.5 weight, scaled 1:1 and translated so its ink — not its
  bounding box — is centred in the tile.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7.5" fill="#6c4cf5"/>
  <g transform="translate(4 3.9)" fill="none" stroke="#f6f2e9" stroke-width="3.5" stroke-linecap="round">
    <path d="M7.2 4v16"/>
    <circle cx="12.6" cy="8.2" r="4.2"/>
    <circle cx="12.6" cy="16" r="4.2"/>
  </g>
</svg>
